<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Cleaner - Remover Duplicatas</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/progress.js') }}" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Drive Cleaner</h1>
            <p class="subtitle">Remova arquivos duplicados do seu Google Drive</p>
        </header>

        <div class="card">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('analisar') }}" method="POST">
                <h2>Escolha o que analisar:</h2>

                <label for="folder_id"><strong>📂 Pasta:</strong></label>
                <select name="folder_id" id="folder_id" class="form-control">
                    <option value="">Drive inteiro</option>
                    {% for folder in folders %}
                        <option value="{{ folder.id }}">{{ folder.name }}</option>
                    {% endfor %}
                </select>

                <label for="file_type" style="margin-top: 1rem;"><strong>📄 Tipo de Arquivo:</strong></label>
                <select name="file_type" id="file_type" class="form-control">
                    <option value="image">Imagens</option>
                    <option value="video">Vídeos</option>
                    <option value="document">Documentos</option>
                </select>

                <div class="text-center" style="margin-top: 2rem;">
                    <button type="submit" class="btn">🔍 Iniciar Análise</button>
                </div>
            </form>
        </div>

        <div class="progress-container">
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="progress-label">
                <span id="progress-text">0 / 0 arquivos (0%)</span> concluído
            </div>
        </div>        
    </div>
</body>
</html>
